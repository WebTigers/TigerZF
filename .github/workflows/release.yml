name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest --no-dev

    # Note: the full test suite runs on every push/PR via phpunit.yml (with the
    # required memory_limit=-1). Re-running it here needs dev deps (which --no-dev
    # skips) and would just duplicate that gate, so the release builds from
    # already-green main.

    - name: Create Release Archive
      run: |
        tar -czf tigerzf-${GITHUB_REF#refs/tags/}.tar.gz \
          --exclude='.git*' \
          --exclude='tests' \
          --exclude='demos' \
          --exclude='documentation' \
          --exclude='*.md' \
          --exclude='Vagrantfile' \
          --exclude='.travis.yml' \
          .
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: tigerzf-*.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-packagist:
    name: Publish to Packagist
    runs-on: ubuntu-latest
    needs: release
    
    steps:
    - name: Trigger Packagist Update
      run: |
        curl -XPOST -H'content-type:application/json' \
        'https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}' \
        -d'{"repository":{"url":"https://packagist.org/packages/webtigers/tigerzf"}}'